networks:
  sse-network:
    external: true
    name: sse-network

services:
  redis:
    image: redis:alpine
    container_name: sse-redis
    networks:
      - sse-network
    restart: unless-stopped

  sric-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sric-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=sse-redis
      - ODXT_URL=http://odxt-backend:8001
    networks:
      - sse-network
    depends_on:
      - redis
    restart: unless-stopped

  sric-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: development
    container_name: sric-frontend
    ports:
      - "3000:5173"
    networks:
      - sse-network
    depends_on:
      - sric-backend
    restart: unless-stopped
